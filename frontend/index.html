<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="shell">

    <header class="top-bar">
      <div class="brand">PTT Assistant</div>
      <div class="connection-dot" id="connectionDot" title="Server status"></div>
    </header>

    <main class="stage">

      <div class="status-area">
        <p class="status-label" id="statusLabel">Hold to speak</p>
        <div class="waveform" id="waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <button
        class="ptt-btn"
        id="pttBtn"
        aria-label="Push to talk"
        aria-pressed="false"
      >
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
          <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="pulse-ring" id="pulseRing" aria-hidden="true"></div>
      </button>

      <p class="hint-text" id="hintText">Press and hold the button while speaking, then release</p>

    </main>

    <section class="transcript-panel" id="transcriptPanel" aria-live="polite">

      <div class="exchange" id="exchangeContainer">
        <div class="empty-state" id="emptyState">
          <span>Your conversation will appear here</span>
        </div>
      </div>

    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
